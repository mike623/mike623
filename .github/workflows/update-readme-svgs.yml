name: Update Dynamic PS1 Biohazard Profile

on:
  schedule:
    # Refresh every 6 hours so ECG, Inventory, FILE archive, and README stay live
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-readme-svgs.mjs"
      - ".github/workflows/update-readme-svgs.yml"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate dynamic README.md and PS1 Biohazard SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-readme-svgs.mjs

      - name: Commit updated README and SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh dynamic PS1 Biohazard profile"
            git push
          else
            echo "No profile changes to commit."
          fi
