name: Update PS1 Biohazard Profile SVGs

on:
  schedule:
    # Refresh daily at 03:15 UTC
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-readme-svgs.mjs"
      - ".github/workflows/update-readme-svgs.yml"

permissions:
  contents: write

jobs:
  update-svgs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate PS1 Biohazard SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-readme-svgs.mjs

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh PS1 Biohazard profile SVGs"
            git push
          else
            echo "No SVG changes to commit."
          fi
